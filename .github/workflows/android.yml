name: Android checks and API27 hotspot recovery
on:
  push:
    branches: ['feature/ts7-hotspot-wake-v0246', 'hotspot-sync/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install upstream Android toolchain
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;25.2.9519653'
      - name: Required upstream checks (identity-free debug build)
        run: |
          bash ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest :home:testDebugUnitTest \
            :mobile:lintDebug :home:lintDebug :maphost:lintDebug \
            :mobile:assembleDebug :home:assembleDebug :maphost:assembleDebug \
            :mobile:assembleDebugAndroidTest --max-workers=2 -I scripts/test-jvm.gradle
      - name: Enable KVM for stock API27 emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 27
          target: default
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          script: bash scripts/test-hotspot-api27.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-debug.html
            api27-hotspot.txt
          if-no-files-found: ignore
