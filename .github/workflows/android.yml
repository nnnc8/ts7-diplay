name: Android checks and API27 hotspot recovery
on:
  push:
    branches: ['feature/ts7-hotspot-wake-v0246', 'feature/ts7-hotspot-wake-v0248', 'hotspot-sync/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install upstream Android toolchain
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;25.2.9519653'
      - name: Required upstream checks (identity-free debug build)
        run: |
          test -z "${DIPLAY_AUTH_ASSETS_DIR:-}"
          test ! -d .private/runtime-assets
          test ! -d auth-assets
          bash ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest :home:testDebugUnitTest \
            :mobile:lintDebug :home:lintDebug :maphost:lintDebug \
            :mobile:assembleDebug :home:assembleDebug :maphost:assembleDebug \
            :mobile:assembleDebugAndroidTest --continue --max-workers=2 -I scripts/test-jvm.gradle
      - name: Enable KVM for stock API27 emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 27
          target: default
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          script: bash scripts/test-hotspot-api27.sh
      - name: Verify and package the TS7 diagnostic APK
        run: |
          mkdir -p diagnostic-apk
          cp mobile/build/outputs/apk/debug/mobile-debug.apk diagnostic-apk/ts7-hotspot-diagnostic-v0.2.48.apk
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging diagnostic-apk/ts7-hotspot-diagnostic-v0.2.48.apk > diagnostic-apk/apk-badging.txt
          grep -Fq "package: name='com.shihab.diplay.hudtest' versionCode='68' versionName='0.2.48-hud-test'" diagnostic-apk/apk-badging.txt
          grep -Fxq "sdkVersion:'19'" diagnostic-apk/apk-badging.txt
          unzip -Z1 diagnostic-apk/ts7-hotspot-diagnostic-v0.2.48.apk > diagnostic-apk/apk-entries.txt
          # The upstream res/raw/update_ca_bundle.pem is a public TLS trust store.
          # Reject accessory identities and key containers, not public update CAs.
          if grep -Ei '(^assets/offline-mfi/|\.(pk8|p7b|key|p12|pfx|jks|keystore)$|^assets/.*\.pem$)' diagnostic-apk/apk-entries.txt; then
            echo 'Diagnostic APK must contain no authentication credentials.' >&2
            exit 1
          fi
          git rev-parse HEAD > diagnostic-apk/source-sha.txt
          (cd diagnostic-apk && sha256sum ts7-hotspot-diagnostic-v0.2.48.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: ts7-hotspot-diagnostic-v0248
          path: diagnostic-apk/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-debug.html
            api27-hotspot.txt
          if-no-files-found: ignore
